<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather in Class</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="location-bar">
    <input
      type="text"
      id="zip-input"
      inputmode="numeric"
      maxlength="5"
      placeholder="Zip code"
      aria-label="Zip code"
    />
    <button id="locate-btn" type="button" aria-label="Use my location">
      <img src="assets/location.png" alt="" width="24" height="24" />
    </button>
    <p id="zip-error" class="error-text" hidden>Invalid zip code</p>
    <p id="location-status" class="status-text" hidden></p>
  </header>

  <main id="app">
    <p id="placeholder-status">Enter a zip code or use your location to get started.</p>

    <div id="forecast-view" hidden>
      <p id="location-name"></p>
      <p id="current-forecast-label"></p>

      <div id="character-stage">
        <img id="weather-icon" alt="" />
        <img id="character-sprite" alt="" />
      </div>
      <p id="temperature-display"></p>

      <ul id="reminders-list" aria-label="Reminders"></ul>

      <div id="day-selector" role="group" aria-label="Choose a forecast day"></div>

      <p id="data-source-credit">Data: Open-Meteo</p>
    </div>
  </main>

  <div id="loading-overlay" hidden>
    <div class="spinner" role="status" aria-label="Loading"></div>
  </div>

  <div id="error-panel" hidden>
    <p id="error-message">Couldn't load the forecast right now.</p>
    <button id="retry-btn" type="button">Retry</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
